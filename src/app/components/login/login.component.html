<div class="relative grid grid-cols-2 w-[1440px]">
  <div class="bg-white p-[48px]">
    <div class="">
      <a [routerLink]="['/']" class="flex items-center gap-2">
        <img src="../../../assets/icon/logo.svg" alt="" class="" />
        <span class="text-[rgba(108,95,188,1)] font-poppins_semiBold"
          >eatly</span
        >
      </a>
    </div>
    <div class="text-center">
      <h2 class="font-poppins_medium text-[35px] text-[#323142]">
        Sign In To eatly
      </h2>
      <div class="flex justify-center items-center gap-[20px] mt-[48px]">
        <button
          class="bg-[#F5F5F5] py-[15px] px-[75px] border rounded-[13px] hover:border-[#6C5FBC]"
        >
          <img
            src="../../../assets/icon/icon-G.svg"
            alt=""
            class="w-[26px] h-[26px]"
          />
        </button>
        <button
          class="bg-[#F5F5F5] border rounded-[13px] py-[15px] px-[75px] hover:border-[#6C5FBC]"
        >
          <img
            src="../../../assets/icon/logo-Apple.svg"
            alt=""
            class="w-[26px] h-[26px]"
          />
        </button>
      </div>
      <p
        class="font-poppins_medium text-[#005A6459] text-center text-[20px] mt-[33px]"
      >
        OR
      </p>
      <form
        action=""
        class="flex flex-col justify-center gap-[24px] items-center mt-[35px]"
      >
        <div
          class="w-[383px] group flex items-center gap-[20px] bg-[#F5F5F5] rounded-[14px] p-[24px] border hover:border-[#6C5FBC] focus-within:border-[#6C5FBC]"
        >
          <div class="group">
            <img
              src="../../../assets/icon/email-icon.svg"
              class="block group-hover:hidden group-focus-within:hidden"
            />
            <img
              src="../../../assets/icon/email-icon-color.svg"
              class="hidden group-hover:block group-focus-within:block"
            />
          </div>
          <input
            type="text"
            placeholder="Email"
            class="w-full bg-[#F5F5F5] outline-none text-[#C2C3CB] placeholder:font-poppins_semiBold placeholder:text-[#C2C3CB] font-poppins_medium focus-within:text-[#6C5FBC]"
          />
        </div>
        <div
          class="w-[383px] group flex items-center gap-[20px] bg-[#F5F5F5] rounded-[14px] p-[24px] border hover:border-[#6C5FBC] focus-within:border-[#6C5FBC]"
        >
          <div class="group">
            <img
              src="../../../assets/icon/lock-icon.svg"
              class="block group-hover:hidden group-focus-within:hidden"
            />
            <img
              src="../../../assets/icon/lock-icon-color.svg"
              class="hidden group-hover:block group-focus-within:block"
            />
          </div>
          <input
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
            class="w-full bg-[#F5F5F5] outline-none text-[#C2C3CB] placeholder:font-poppins_semiBold placeholder:text-[#C2C3CB] font-poppins_medium focus-within:text-[#6C5FBC]"
          />
         <button (click)="togglePassword()" type="button" class="groupa">
            @if (showPassword) {
                <i class="pi pi-eye text-[#005A6459] group-hover:text-[#6C5FBC] group-focus-within:text-[#6C5FBC]"></i>
            }@else {
                <i class="pi pi-eye-slash text-[#005A6459] group-hover:text-[#6C5FBC] group-focus-within:text-[#6C5FBC]"></i>
            }
         </button>
        </div>
        <button
          class="w-[383px] inline-block text-center font-inter_medium bg-[rgba(108,95,188,1)] px-[26px] py-[15px] rounded-[17px] text-white border duration-300 hover:text-[rgba(108,95,188,1)] hover:border hover:border-[rgba(108,95,188,1)] hover:bg-white"
        >
          SIGN IN
        </button>
      </form>
      <p class="text-center text-[18px] text-[#3E3E3E] mt-[23px]">
        Already Have An Account?
        <button (click)="(openSingUp.emit())" class="text-[#6C5FBC] font-poppins_bold">Sing Up</button>
      </p>
    </div>
    <div
      class="flex justify-between text-[#718096] font-poppins_medium mt-[90px]"
    >
      <p class="">Privacy Policy</p>
      <p class="">Copyright 2022</p>
    </div>
  </div>
  <div class="bg-[#6C5FBC] flex justify-center items-center flex-col p-[70px]">
    <img src="../../../assets/images/hero-dish.png" alt="" />
    <div class="text-white text-center">
      <h3 class="font-manrope_bold text-[40px]">Find Foods With Love</h3>
      <p class="font manrope_medium text-[14px]">
        Eatly Is The Food Delivery Dashboard And Having More Than 2K+ Dishes
        Including Asian, Chinese, Italians And Many More. Our Dashboard Helps
        You To Manage Orders And Money.
      </p>
    </div>
  </div>
  <button (click)="(close.emit())" class="absolute top-[10px] right-[10px] pi pi-times text-white text-[30px]" ></button>
</div>
