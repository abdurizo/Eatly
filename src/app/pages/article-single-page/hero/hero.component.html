<header class="container lg:mt-[90px] xl:mt-[126px]">
  <h2 class="font-poppins_semiBold lg:text-[26px] xl:text-[37px]">
    {{ data?.title }}
  </h2>
  <div
    class="flex items-center gap-[8px] xl:gap-[11px] sm:mt-[22px] xl:mt-[32px] sm:mb-[43px] xl:mb-[60px]"
  >
    <div
      class="w-[39px] xl:w-[55px] h-[39px] xl:h-[55px] rounded-[50px] overflow-hidden border"
    >
      <img [src]="data?.user" alt="" class="w-full" />
    </div>
    <div class="">
      <p class="font-poppins_regular text-[#8D8D8D] md:text-[10px] xl:text-[15px]">
        Written By
      </p>
      <p class="font-poppins_medium md:text-[15px] xl:text-[21px]">Perperzon</p>
    </div>
  </div>
  <div class="max-h-[403px] aspect-3/4">
    <img [src]="data.photo_bg" alt="" class="w-full">
  </div>
</header>
