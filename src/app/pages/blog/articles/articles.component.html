<section class="section container">
  <h2 class="title mt-[100px] md:mt-[0]">
    Latest <span class="text-[rgba(92,78,174,1)]">Articles</span>
  </h2>
  <div class="grid md:grid-cols-3 gap-[36px] md:gap-[20px] xl:gap-[30px] mt-[58px] lg:mt-[53px] xl:mt-[78px]">
    @for (item of article; track item.id) {
      <app-article-card [data]="item"></app-article-card>
    }
  </div>
</section>
